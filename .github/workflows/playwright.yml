# Default CI browser tests — local API only (127.0.0.1:3001).
# Runs `pnpm test:playwright:ci` (PW_SUITE=ci): e2e/flows, pwa, phase-9-drills only.
# Never runs signup-flow, ui-smoke, example, staging-*, or e2e/simulation (workday).
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 🎭 Playwright E2E (shard ${{ matrix.shard }})
    # Was 45. The suite's own globalTimeout is 12 min and a healthy shard finishes
    # in ~2; 45 only ever bought a hung run the right to burn 45 minutes of runner
    # time before anyone noticed (run 32217586129 did exactly that).
    timeout-minutes: 20
    runs-on: ubuntu-latest

    # Split the allowlisted CI suite across parallel shards to cut PR
    # feedback time. `fail-fast: false` keeps every shard reporting.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vettrack
          POSTGRES_PASSWORD: vettrack
          POSTGRES_DB: vettrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vettrack -d vettrack_test"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vettrack:vettrack@127.0.0.1:5432/vettrack_test
      SESSION_SECRET: ci-test-secret-that-is-long-enough-32chars
      PORT: 3001
      # E2E API must stay NODE_ENV=development (schedulers + SSE outbox). PLAYWRIGHT_E2E
      # relaxes per-IP rate limits — see shouldSkipPerIpApiThrottles in rate-limiters.ts.
      PLAYWRIGHT_E2E: "true"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium was re-downloaded on every shard of every run. Key on the resolved
      # Playwright version so a version bump busts it and nothing else does.
      - name: 🔎 Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: ♻️ Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Only on a cache MISS, and this is the step that actually costs: `--with-deps`
      # shells out to apt, which measured 232s on its own when run separately. The
      # ubuntu-latest image already ships chromium's shared libraries, so on a cache
      # hit we deliberately run NOTHING here rather than re-asserting apt packages
      # that are already present — that reasserting was slower than the download it
      # replaced (measured: browser install 0s, install-deps 232s).
      - name: 🌐 Install Playwright Browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: 🏗️ Build frontend
        run: |
          # Dev-bypass auth for E2E: omit Clerk key (empty GitHub secret still sets the var).
          unset VITE_CLERK_PUBLISHABLE_KEY
          pnpm build
        env:
          NODE_ENV: production

      - name: 🗄️ Database migrations
        run: pnpm migrate

      - name: 🚀 Start app for Playwright
        run: pnpm start:playwright-api > /tmp/vettrack-playwright.log 2>&1 &

      - name: ⏳ Wait for API readiness
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/healthz > /dev/null; then
              echo "✅ API ready"
              exit 0
            fi
            sleep 2
          done
          echo "❌ API did not become ready at http://127.0.0.1:3001/api/healthz"
          tail -n 200 /tmp/vettrack-playwright.log || true
          exit 1

      - name: 🌱 Seed E2E fixtures
        run: pnpm seed:dev:e2e

      # Safe allowlist only — not signup, ui-smoke, or staging specs.
      # `--shard=N/total` splits the allowlist deterministically per job.
      - name: 🎭 Run Playwright tests
        run: pnpm test:playwright:ci --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TEST_BASE_URL: http://127.0.0.1:3001

      - name: 📤 Upload dev log on failure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: vettrack-playwright-dev-log-shard-${{ matrix.shard }}
          path: /tmp/vettrack-playwright.log
          retention-days: 30

      # Was `!cancelled()` — uploading (and retaining for 30 days) the HTML report
      # of a fully green shard costs time on every run and is read by nobody. On
      # failure it is exactly what you want, so keep it there.
      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14
