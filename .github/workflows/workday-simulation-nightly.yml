# Staging workday simulation.
#
# NIGHTLY SCHEDULE DISABLED (2026-08-19). Both preconditions are missing on this repo, so the
# job could never do any work:
#   1. no `staging` branch on origin  — `git ls-remote --heads origin` returns none
#   2. no TEST_BASE_URL_STAGING secret — the run log prints "not configured"
# It nevertheless ran every night and reported GREEN. The old "skip" steps only ran `exit 0`,
# which succeeds a step but does NOT skip a job, so each run fell through to
# `actions/checkout` with `ref: staging`, failed there, and `continue-on-error: true` painted
# the run green anyway. Example: run 32100016045 (2026-08-18) — run conclusion "success",
# job conclusion "failure", 40s, zero simulation executed. A gate that silently no-ops is
# worse than no gate, because it gets counted as coverage.
#
# TO RE-ENABLE: create the `staging` branch on origin AND set the *_STAGING secrets
# (see docs/staging-e2e-runbook.md), then uncomment the `schedule:` block below. The preflight
# step now FAILS LOUDLY instead of pretending to skip, and `continue-on-error` is gone, so a
# re-enabled cron reports the truth.
#
# Until then the simulation is still reachable locally: `pnpm test:playwright:workday`
# against a real staging deployment via env vars — independent of git branch state.
name: Workday simulation (staging nightly)

on:
  # schedule:
  #   - cron: "0 4 * * *"  # 04:00 UTC — re-enable once the staging branch + secrets exist
  workflow_dispatch:

concurrency:
  group: workday-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workday:
    name: Staging workday
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scheduled runs fire on the default branch, so `github.ref` is never
    # `refs/heads/staging` for a cron trigger - gate by event name instead.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    env:
      STAGING_E2E_CONFIRM: "yes"
      TEST_BASE_URL: ${{ secrets.TEST_BASE_URL_STAGING }}
      STAGING_E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD_STAGING }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_STAGING }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY_STAGING }}

    steps:
      # Fails loudly rather than exiting 0. An `exit 0` here would succeed the step and let the
      # job fall through to a checkout of a ref that does not exist - the exact bug this
      # workflow shipped with.
      - name: Preflight - staging branch and secrets must both exist
        run: |
          missing=0
          if [ -z "${TEST_BASE_URL}" ]; then
            echo "::error::TEST_BASE_URL_STAGING is not configured - see docs/staging-e2e-runbook.md"
            missing=1
          fi
          if ! git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" staging >/dev/null 2>&1; then
            echo "::error::branch 'staging' does not exist on origin - there is nothing for this simulation to check out or exercise"
            missing=1
          fi
          if [ "${missing}" -ne 0 ]; then
            echo "::error::workday simulation cannot run; fix the above, then re-enable the schedule in this file"
            exit 1
          fi
          echo "preflight ok: staging branch present and TEST_BASE_URL set"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The simulation exercises the deployed staging server; check out
          # the staging ref so the Playwright runner code matches it.
          ref: staging

      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run workday simulation
        run: pnpm test:playwright:workday --reporter=list

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workday-simulation-artifacts
          path: artifacts/
          retention-days: 14
