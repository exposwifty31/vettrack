name: CI — VetTrack

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel an in-flight main run — it may be mid-deploy, and a canceled
# `railway up` upload can still finish building after a newer one (out-of-order deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # tsc lives in ONE dedicated job (was duplicated across the old test job and
  # architecture-gates). Incremental + a restored .cache means unchanged files skip
  # re-checking: cold 30-60s each → warm 1-3s.
  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # --tsBuildInfoFile is required: --noEmit otherwise suppresses the buildinfo write,
      # which incremental needs. .cache is keyed on lockfile+tsconfig, with restore-keys
      # falling back to the most recent partial cache.
      - name: ♻️ Restore tsc build info
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsc-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'tsconfig*.json') }}-
            tsc-${{ runner.os }}-

      - name: 🔷 TypeScript (frontend)
        run: pnpm exec tsc --noEmit --incremental --tsBuildInfoFile .cache/tsc-fe.tsbuildinfo

      - name: 🔷 TypeScript (server)
        run: pnpm exec tsc --noEmit --project tsconfig.server-check.json --incremental --tsBuildInfoFile .cache/tsc-srv.tsbuildinfo

      # The RN repo's endpoint-drift guard validates every /api path its client
      # builds against a manifest generated from THIS route table. The generator
      # fails when a module under server/routes/ declares an endpoint the walk
      # cannot reach — i.e. when a route is registered by a form it does not know
      # (two such forms already exist: `mountEquipmentWaitlistRoutes(router)` and
      # `mountRfidRoutes(app, path, factory)`).
      #
      # Without this step that failure surfaces only when someone next regenerates
      # the manifest, and until then the manifest silently UNDER-REPORTS — which
      # would let the RN guard pass green over paths it never checked. Run here so
      # the repo that owns the routes is the one that notices. Output is discarded;
      # the exit code is the whole point.
      - name: 🗺️ Server route manifest is still derivable
        run: node scripts/generate-server-route-manifest.mjs --out "$RUNNER_TEMP/server-routes.manifest.json"

  # Frontend production build — pulled out of the old test job so it isn't repeated
  # once per test shard.
  build:
    name: 🏗️ Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Frontend build
        run: |
          export VITE_CLERK_PUBLISHABLE_KEY="${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_ci_dummy_publishable_key}"
          pnpm build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}

  # Vitest sharded 4 ways (was one ~9½-min job). fail-fast:false so one shard failing
  # still reports the others. Each shard is a fresh runner with its own Postgres +
  # migrations — the default suite is file-isolated, so this is embarrassingly parallel.
  # Coverage is unchanged: vitest reads the same vite.config.ts excludes as `pnpm test`.
  test:
    name: 🧪 Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vettrack
          POSTGRES_PASSWORD: vettrack
          POSTGRES_DB: vettrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vettrack:vettrack@localhost:5432/vettrack_test
      SESSION_SECRET: ci-test-secret-that-is-long-enough-32chars
      PORT: 3001

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: tests/claims-ledger.test.ts resolves every commit and
          # pull-request citation in the governed docs against real history. On a
          # shallow clone those objects are absent and scripts/verify/git-facts.cjs
          # fails loud rather than passing a check it could not perform.
          fetch-depth: 0

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌿 Fetch default branch (claim verification, layer 2)
        # NO FALLBACK. The warning form exited 0, so a failed fetch let the job
        # run on whatever `main` ref happened to be present. That is not "layer 2
        # unavailable" — measured with the remote ref gone, this repository's own
        # documents resolved against a stale local `refs/heads/main` and produced
        # 100 failures, every one a true sentence about work that had landed. A
        # fetch that cannot get the ground truth fails the job.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # Apply all `migrations/*.sql` via `server/migrate.ts` (tracks `vt_migrations`).
      - name: 🗄️ Database migrations
        run: pnpm migrate

      - name: 🧪 Test suite (shard ${{ matrix.shard }}/4)
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/4 --reporter=dot

  # Layer 3 of the claim gate: run the gates the documentation claims are green,
  # then refuse any documented "green" the recorded run does not support. It is a
  # separate job because the evidence report is bound to the tree and to the
  # runner that produced it — a sharded test job on another runner could not have
  # one, which is why VT_ENFORCE_EVIDENCE is set HERE and nowhere else.
  claims:
    name: 📎 Claim verification (evidence)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌿 Fetch default branch
        # NO FALLBACK. The warning form exited 0, so a failed fetch let the job
        # run on whatever `main` ref happened to be present. That is not "layer 2
        # unavailable" — measured with the remote ref gone, this repository's own
        # documents resolved against a stale local `refs/heads/main` and produced
        # 100 failures, every one a true sentence about work that had landed. A
        # fetch that cannot get the ground truth fails the job.
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: 🧾 Evidence gates (typecheck + i18n parity + depcruise)
        run: pnpm verify:evidence

      - name: 📎 Claim gate (all four layers)
        run: pnpm verify:claims
        env:
          VT_ENFORCE_EVIDENCE: "1"

  integration-ops:
    name: 🔌 Integration ops
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vettrack
          POSTGRES_PASSWORD: vettrack
          POSTGRES_DB: vettrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vettrack:vettrack@localhost:5432/vettrack_test
      SESSION_SECRET: ci-test-secret-that-is-long-enough-32chars
      PORT: 3001

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Database migrations
        run: pnpm migrate

      - name: 🔌 Integration ops suite
        run: pnpm test:integration:ops

      # doctor-shift-gate and seed-reviewer-demo are excluded from `pnpm test` by
      # vite.config.ts (both need a real database) and were named by NO workflow, so
      # the cross-repo contract they pin — migrations 181-184 and the
      # `source: "doctor_gate"` shape the RN app and the TV ward board both consume —
      # was enforced by nothing, on either side of the seam.
      #
      # NAMED FILES, deliberately, rather than `pnpm test:db-integration`. That
      # script's config also includes equipment-operational-state, which the step
      # above already covers via test:integration:ops. Adding the whole config would
      # run that file twice per PR, and measured on a clean database it FAILS in this
      # config's ordering (10 of 49 — worker sweeps and operational metrics) while
      # passing in the ops one. Importing a known instability to buy coverage that
      # already exists is a bad trade. These two pass clean: 15 tests, ~30s.
      # Both suites above are `describe.skipIf(!dbReachable)`. That is correct on a
      # laptop with no database and inverts here: an unset or unreachable DATABASE_URL
      # makes both skip, vitest exits 0, and the step below reports success having
      # asserted nothing — the same "gate that passes when it did not run" shape the
      # rfid-controller comment rejects. The preflight asserts the suites' own probe
      # condition (plus the migration 181-184 table doctor-gate documents needing) and
      # fails loud. Its pure branches are tested in tests/ci-db-integration-preflight.test.ts.
      - name: 🚦 Refuse a silent skip
        run: node scripts/ci/db-integration-preflight.mjs

      - name: 🩺 Cross-repo contract suites (doctor gate + reviewer seed)
        run: >-
          pnpm exec vitest run --config vitest.db-integration.config.ts
          tests/doctor-shift-gate.integration.test.ts
          tests/seed-reviewer-demo.integration.test.ts

  # The six live-server suites in tests/*.test.js. They are excluded from `pnpm test`
  # by vite.config.ts because they need a real server on :3001 rather than vitest, and
  # — verified 2026-08-22 — no workflow named any of them, so they ran NOWHERE. Two of
  # them cover Code Blue and equipment scan.
  #
  # Same shape as integration-ops above, and the same trap: each suite ends with
  # `if (failed > 0) process.exit(1)`, so a suite that asserted nothing exits 0. The
  # runner gates on the reported assertion COUNT against a recorded floor, which is the
  # follow-up db-integration-preflight.mjs names in its own SCOPE note. Pure branches
  # tested in tests/ci-live-server-tests.test.ts.
  db-integration:
    name: 🗄️ DB integration suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vettrack
          POSTGRES_PASSWORD: vettrack
          POSTGRES_DB: vettrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vettrack:vettrack@localhost:5432/vettrack_test
      SESSION_SECRET: ci-test-secret-that-is-long-enough-32chars
      PORT: 3001
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile
      - name: 🗄️ Database migrations
        run: pnpm migrate
      # The 23 vitest suites vite.config.ts excludes because they need a real
      # database. 18 of them were named by NO runner at all until 2026-09-01 —
      # docking, equipment-anchor, room-readiness and the shift-handover family
      # among them — while this script and its config already existed. A runner
      # nothing invokes is indistinguishable from no runner, which is why the
      # step below exists and why tests/excluded-suite-coverage.test.ts now fails
      # when a runner is missing from this file.
      - name: 🗄️ DB integration suites (vitest)
        run: pnpm test:db-integration
      # The eight DB-backed files that are NOT vitest suites — standalone tsx
      # programs that print a skip line and exit 0 when DATABASE_URL is unset.
      # The runner treats that skip as a refusal, so this step cannot go green by
      # running nothing.
      - name: 🗄️ DB script suites (tsx)
        run: pnpm test:db-scripts

  live-server:
    name: 🌐 Live-server suites
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vettrack
          POSTGRES_PASSWORD: vettrack
          POSTGRES_DB: vettrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://vettrack:vettrack@localhost:5432/vettrack_test
      SESSION_SECRET: ci-test-secret-that-is-long-enough-32chars
      PORT: 3001
      # charge-alert-worker.test.js documents TEST_MODE=true as its precondition; the
      # other five do not need it and are unaffected by it.
      TEST_MODE: "true"
      # No CLERK_SECRET_KEY here, so auth-mode already resolves to dev-bypass. Set
      # explicitly so adding a Clerk secret to this workflow later cannot silently
      # flip these suites into 401s.
      CLERK_ENABLED: "false"

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Database migrations
        run: pnpm migrate

      # NOT optional. equipment-scan-e2e's fixture case asserts GET /api/equipment/eq1,
      # and without this seed it does not merely fail that one case — the suite reports
      # 29 assertions instead of 31, because two others never run. Measured, not assumed.
      - name: 🌱 Seed the e2e fixture (eq1)
        run: pnpm seed:dev:e2e

      - name: 🚀 Boot the API and wait for readiness
        run: |
          # All six suites hard-code their base URL at :3001 and none of them reads
          # PORT (`grep -c process.env tests/<suite>.test.js` → 0, for all six). So this
          # job's real contract is the PORT NUMBER, not the env var, and the probe below
          # is deliberately not parameterised on $PORT: at PORT=4000 a parameterised
          # probe would go green against 4000 while all six suites hammered a dead 3001,
          # which is a worse failure than this one. Assert the coupling instead of
          # hiding it, and fail in one second rather than after a 60s misleading wait.
          if [ "${PORT}" != "3001" ]; then
            echo "::error::PORT is '${PORT}', but the six live-server suites hard-code :3001. Either set PORT back to 3001, or change every suite's BASE constant and this guard together."
            exit 1
          fi
          pnpm exec tsx server/index.ts > /tmp/vt-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -m 2 -o /dev/null http://127.0.0.1:3001/api/health; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          # Loud, with the log — a suite run against a dead server produces a confusing
          # pile of connection errors instead of naming the actual cause.
          echo "::error::API did not become ready within 60s"
          cat /tmp/vt-server.log
          exit 1

      - name: 🌐 Live-server suites (count-gated)
        run: pnpm test:live-server

      - name: 🧾 Server log on failure
        if: failure()
        run: cat /tmp/vt-server.log || true

  # packages/rfid-controller ships its own vitest config + tsconfig and is a
  # contract-bearing surface (signed batches to POST /api/rfid/events). Neither
  # script was reachable from any workflow, so its tests and types were enforced
  # by nothing. No DB/Redis: the package has no runtime deps.
  #
  # DELIBERATELY IN THIS WORKFLOW, not a separate paths-filtered one. Splitting it out
  # was suggested to save CI time; measured, it saves none. The job runs 33-41s in
  # PARALLEL with jobs whose critical path is ~132s (Tests shard 4/4), so it adds zero
  # wall-clock. Against that, a separate workflow cannot be referenced by this file's
  # `needs:`, so the merge gate below would lose the very enforcement this job exists to
  # add; and a `paths:`-filtered required check never reports on PRs that miss the
  # filter, leaving them waiting on a status that will never arrive. The `if:` variant is
  # no better — the job reports `skipped`, so the gate has to accept `skipped` as a pass,
  # which is a gate that passes when it did not run. Leave it here.
  rfid-controller:
    name: 📡 RFID controller
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4.4.0
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔷 TypeScript (rfid-controller)
        run: pnpm rfid-controller:typecheck

      - name: 🧪 RFID controller tests
        run: pnpm test:rfid-controller

  architecture-gates:
    name: 🏛️ Architecture gates (G1)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 @vettrack/contracts gate
        run: bash scripts/ci/contracts-gate.sh

      # tsc moved to the dedicated `typecheck` job (it was duplicated here).
      - name: 🛡️ dependency-cruiser
        run: pnpm exec depcruise --config .dependency-cruiser.cjs --output-type err --ignore-known .dependency-cruiser-known-violations.json server src

      - name: 🔄 madge cycle baseline
        run: node scripts/architecture/compare-cycles.mjs

      # ENFORCING. Removing `continue-on-error` alone would have changed nothing:
      # the command hardcoded `--warn-only`, which this script's own --help documents
      # as "exit 0 (default, G3)". Two independent disarms on one gate, and neither
      # was visible from the other. Both are gone.
      #
      # `--all`, not `--touched`: the baseline makes a full scan safe, and a full scan
      # also catches a violation moved into an untouched file by a rename — which is
      # exactly the shape `--touched` cannot see.
      - name: 🏥 tenant query lint (new findings only)
        run: >-
          node scripts/architecture/tenant-query-lint.mjs
          --all --baseline .tenant-lint-known-violations.json

      - name: 🔑 query key registry drift (warn only, G4)
        run: node scripts/architecture/collect-query-keys.mjs --warn-only
        continue-on-error: true

      - name: 🛣️ route contract drift (warn only, G5)
        run: node scripts/architecture/extract-express-routes.mjs --warn-only
        continue-on-error: true

      # TODO: remove --no-exit-code once the dead-code baseline is established and violations are resolved
      - name: Dead code check (knip)
        run: pnpm knip --no-exit-code
        continue-on-error: true

  deploy:
    name: 🚢 Deploy to Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, build, test, integration-ops, rfid-controller, architecture-gates]
    # vars.RAILWAY_USE_CLI_DEPLOY (repo *variable*, not secret) is the deploy kill-switch.
    # workflow_dispatch on main = "redeploy main" recovery button.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && vars.RAILWAY_USE_CLI_DEPLOY == 'true'
    # Serialize production deploys across runs; never cancel one mid-flight.
    concurrency:
      group: railway-production-deploy
      cancel-in-progress: false

    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
      DB_CONFIG_ENCRYPTION_KEY: ${{ secrets.DB_CONFIG_ENCRYPTION_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      DATA_INTEGRITY_HEALTH_TOKEN: ${{ secrets.DATA_INTEGRITY_HEALTH_TOKEN }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
      RAILWAY_WORKER_SERVICE: ${{ secrets.RAILWAY_WORKER_SERVICE }}
      PORT: 3001

    steps:
      # Pinned SHA + no persisted credentials: this job holds RAILWAY_TOKEN and
      # uploads the checkout to Railway — keep the git credential out of it.
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🚀 Deploy
        run: bash deploy.sh --no-color

  # E1 — the deploy that just ran is asked, from the outside, whether it is the
  # revision we shipped and whether the paths CLIENTS call still answer JSON.
  #
  # This is the step that was missing when A1 shipped: the mount moved to
  # /api/clinical, every unit test passed, and the path both clients call fell
  # through to the SPA catch-all as 200 text/html for ~24h. Nothing in CI asked the
  # running server a client's question.
  #
  # Separate job, not a step in `deploy`: that job holds RAILWAY_TOKEN and the
  # production secrets, and a verification step needs none of them. It also needs a
  # Node/pnpm toolchain the deploy job deliberately does not set up.
  #
  # No sleep and no fixed wait. `deploy.sh` returns when Railway has accepted the
  # deploy, not when it is live, so the verifier polls /api/version until gitCommit
  # matches this run's SHA — then and only then does it probe. Before 2026-08-16 it
  # could never get that far: the build reported gitCommit: null and the script
  # polled to its own timeout, which is why wiring it up had to wait for #184.
  verify-deploy:
    name: 🔎 Verify production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy]
    # A skipped `deploy` skips this too (GitHub skips dependents of skipped jobs),
    # so PRs and kill-switched runs never reach it. Stated explicitly anyway: a
    # verification that runs when nothing was deployed would assert against
    # whatever revision happens to be live.
    if: needs.deploy.result == 'success'

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 📦 pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: 🟢 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      # Quoted deliberately. An unquoted empty $GITHUB_SHA would vanish from the
      # command line and the script would take its default; quoted, it arrives as a
      # supplied-but-empty argument, which the script rejects as a broken command
      # line rather than silently verifying the wrong thing.
      - name: 🔎 verify-prod-deploy
        run: pnpm verify:prod-deploy "$GITHUB_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}

  gate:
    name: ✅ Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, build, test, integration-ops, db-integration, live-server, rfid-controller, architecture-gates, deploy, verify-deploy]
    if: always()

    steps:
      - name: Require green checks
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ Typecheck failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Frontend build failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed (one or more shards) — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.integration-ops.result }}" != "success" ]]; then
            echo "❌ Integration ops failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.db-integration.result }}" != "success" ]]; then
            echo "❌ DB integration suites failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.live-server.result }}" != "success" ]]; then
            echo "❌ Live-server suites failed or ran short of their assertion floor — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.rfid-controller.result }}" != "success" ]]; then
            echo "❌ RFID controller tests/typecheck failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.architecture-gates.result }}" != "success" ]]; then
            echo "❌ Architecture gates failed — blocking merge"
            exit 1
          fi
          if [[ "${{ needs.deploy.result }}" != "success" ]]; then
            if [[ "${{ needs.deploy.result }}" == "skipped" ]]; then
              echo "ℹ️ Railway deploy skipped (RAILWAY_USE_CLI_DEPLOY disabled)"
            else
              echo "❌ Railway deploy job did not succeed"
              exit 1
            fi
          fi
          # Skipped is tolerated for the same reason as deploy: no deploy, nothing to
          # verify. A FAILURE is not tolerated — it means the revision that is live is
          # not the one we shipped, or a path a client calls stopped answering JSON.
          # That is precisely the A1 signal, and it must be loud rather than advisory.
          if [[ "${{ needs.verify-deploy.result }}" != "success" ]]; then
            if [[ "${{ needs.verify-deploy.result }}" == "skipped" ]]; then
              echo "ℹ️ Production deploy verification skipped (no deploy ran)"
            else
              echo "❌ Production deploy verification failed — the live revision or a client path is wrong"
              exit 1
            fi
          fi
          echo "✅ All required checks passed"
